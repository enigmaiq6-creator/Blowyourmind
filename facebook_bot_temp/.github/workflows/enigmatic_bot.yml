name: EnigmaIQ Cloud Worker V6🚀

on:
  schedule:
    - cron: '0 */5 * * *' # Bucle: Cada 5 horas
  workflow_dispatch: # Permite ejecución manual (botón play)

permissions:
  contents: write # Para poder actualizar el historial

jobs:
  produce-reel:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Clonar el Cerebro del Bot
      uses: actions/checkout@v4
      
    - name: ⚙️ Instalar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: 📦 Instalar Dependencias (Npm)
      run: npm install

    - name: 🎬 Instalar Motor de Video (FFmpeg)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
    - name: 🧠 Lanzar EnigmaIQ (Generación & Subida)
      env:
        PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        PAGE_ID: ${{ secrets.PAGE_ID }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
        TOGETHER_KEY: ${{ secrets.TOGETHER_KEY }}
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      run: node reel_bot.js

    - name: 💾 Guardar Historial de Temas
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add history.json
        git commit -m "Update history (nube)" || echo "No hay cambios en el historial"
        git push origin main
